[package]
name = "anyhow-fn-context-macro"
version = "0.1.0"
edition = "2024"
description = "Helper for anyhow-fn-context crate."
repository = "https://github.com/tipsypastels/anyhow-fn-context"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"

[dev-dependencies]
anyhow = "1"
